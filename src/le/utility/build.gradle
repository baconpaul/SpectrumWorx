apply plugin: 'com.android.model.native'

apply from: 'utility.gradle'

model {
    android {
        compileSdkVersion = 10
        buildToolsVersion = 23

        defaultConfig.with {
            minSdkVersion   .apiLevel = 10
            targetSdkVersion.apiLevel = 23
        }
    }

    android.ndk {
        moduleName = "Utility"
        ldLibs.addAll( [ "android", "log" ] )
    }
}
